# Two-GPU CI topology: one GB200 for vLLM target inference and one for
# TorchSpec draft training. Keep this deterministic and intentionally small.
model:
  target_model_path: Qwen/Qwen3-8B
  target_model_backend: vllm
  trust_remote_code: true

dataset:
  train_data_path: ../../tests/fixtures/ci_training_smoke.jsonl
  chat_template: qwen
  prompt_key: conversations
  shuffle_dataset: false
  length_group_size: 1

training:
  attention_backend: flex_attention
  micro_batch_size: 1
  draft_accumulation_steps: 1
  learning_rate: 1e-4
  max_concurrent_batches: 1
  max_grad_norm: 0.5
  max_seq_length: 512
  num_epochs: 1
  num_train_steps: 3
  prefetch_depth: 1
  save_interval: 0
  save_per_epoch: false
  seed: 42
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  ttt_length: 3
  warmup_ratio: 0.0

inference:
  inference_engine_type: vllm
  inference_num_gpus: 1
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 2
  inference_batch_size: 1
  inference_buffer_threshold: 2
  max_sample_pool_size: 4
  vllm:
    tp_size: 1
    mem_fraction_static: 0.7
    extra_args:
      enforce_eager: true
      max_model_len: 512
      max_num_batched_tokens: 512

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 2GB
  local_buffer_size: 512MB

output_dir: ""
cache_dir: ../../.ci-cache/qwen3-8b-2gpu-smoke
model_download_dir: null

logging:
  report_to: none

debug:
  enable_perf_metrics: false
  save_debug_train_data: null
