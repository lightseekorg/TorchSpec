[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-rust==1.13.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchspec"
dynamic = ["version"]
description = "Torch-native speculative decoding training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "setuptools",
    "tqdm",
    "wandb",
    "qwen-vl-utils",
    "psutil",
    "numpy<2.4",
    "accelerate",
    "pydantic",
    "openai-harmony",
    "cmake",
    "ninja",
    "packaging",
    "pyzmq",
    "mooncake-transfer-engine>=0.3.10.post1",
    "openai",
    "omegaconf",
    "ray",
    "numba",
]

[tool.setuptools.package-dir]
torchspec_smg = "bindings/smg-tokenizer/python/torchspec_smg"

[tool.setuptools.packages.find]
where = [".", "bindings/smg-tokenizer/python"]
include = ["torchspec*"]
namespaces = false

[tool.setuptools.package-data]
torchspec = ["config/*.json"]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

vllm = [
    "vllm>=0.18.0",
]

trtllm = [
    "tensorrt-llm>=1.3.0rc18",
]

fa = [
    "flash-attn-4>=4.0.0b7",
    "nvidia-cutlass-dsl>=4.4.2",
    "nvidia-cutlass-dsl-libs-base>=4.4.2",
]

megatron = [
    "megatron-core==0.18.0; python_version >= '3.12'",
]


[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "TID252"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["torchspec"]
known-third-party = ["wandb"]
