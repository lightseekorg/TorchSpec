name: SMG tokenizer contract

# The Python bridge lives here. Cargo.toml pins upstream SMG and Cargo.lock pins
# its dependency graph; no separate SMG checkout or companion branch is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        encode_path: [default, v1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install reference and CPU dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system build
      - name: Build and install TorchSpec with its native extension
        env:
          RUSTUP_TOOLCHAIN: '1.98.0'
          ENCODE_PATH: ${{ matrix.encode_path }}
        run: |
          if [[ "$ENCODE_PATH" == v1 ]]; then export TORCHSPEC_SMG_FEATURES=tokenizers-v1; fi
          python -m build --outdir wheelhouse
          uv pip install --system wheelhouse/torchspec-*.whl pytest -r tools/qualification/tokenizer-requirements.txt
          python -I -c "import torchspec, torchspec_smg, torchspec_smg._native"
      - name: Test bundled binding
        run: python -m pytest -q bindings/smg-tokenizer/tests
      - name: Require exact rendering, IDs, masks and encoder selection
        env:
          TOKENIZERS_PARALLELISM: 'false'
          RAYON_NUM_THREADS: '1'
          PYTHONPATH: .
          ENCODE_PATH: ${{ matrix.encode_path }}
        run: |
          python tools/qualification/tokenizer_contract.py --backend smg \
            --encode-path "$ENCODE_PATH" --report tokenizer-contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tokenizer-contract-${{ matrix.encode_path }}
          path: tokenizer-contract.json
