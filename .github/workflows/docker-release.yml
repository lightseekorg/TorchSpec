name: Release Docker Images

# Before the first run, create the public `lightseekorg/torchspec` Docker Hub
# repository. DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must belong to an account
# with write access to that organization repository.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker Hub tag for the vLLM CI image"
        required: true
        default: "ci-vllm-v0.22.1"

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.release.tag_name || inputs.image_tag }}
  cancel-in-progress: false

env:
  IMAGE_REPO: lightseekorg/torchspec

jobs:
  metadata:
    if: github.repository == 'lightseekorg/TorchSpec'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image_tag: ${{ steps.metadata.outputs.image_tag }}
    steps:
      - name: Resolve image tag
        id: metadata
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          release_tag = os.environ.get("RELEASE_TAG", "")
          image_tag = (
              f"{release_tag}-vllm-v0.22.1"
              if release_tag
              else os.environ["INPUT_TAG"]
          )
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", image_tag):
              raise SystemExit(f"Invalid Docker image tag: {image_tag!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"image_tag={image_tag}", file=output)
          print(f"Docker image: lightseekorg/torchspec:{image_tag}")
          PY

  build:
    if: github.repository == 'lightseekorg/TorchSpec'
    needs: metadata
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: docker/vllm/v0.22.1/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,name-canonical=true,push=true
          no-cache: true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.repository == 'lightseekorg/TorchSpec'
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Create multi-platform manifest
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
        run: |
          refs=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            refs+=("$IMAGE_REPO@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create \
            --tag "$IMAGE_REPO:$IMAGE_TAG" \
            "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE_REPO:$IMAGE_TAG"
