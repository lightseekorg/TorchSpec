[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "smg-tokenizer"
version = "0.1.2"
requires-python = ">=3.11"
description = "TorchSpec's in-process bridge to SMG's Rust tokenizer"
license = "Apache-2.0"

[tool.maturin]
python-source = "python"
module-name = "smg_tokenizer._native"
